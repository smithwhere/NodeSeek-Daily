name: NodeSeek 自动签到和随机评论

on:
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * *' # 北京时间每天 00:17

permissions:
  contents: write

concurrency:
  group: nodeseek-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate cookie persistence
        run: python -m unittest -v
      - name: Check configuration
        env:
          NS_USERNAME: ${{ secrets.NS_USERNAME }}
          NS_PASSWORD: ${{ secrets.NS_PASSWORD }}
          YESCAPTCHA_KEY: ${{ secrets.YESCAPTCHA_KEY }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
        run: |
          test -n "$NS_USERNAME" && test -n "$NS_PASSWORD" && test -n "$YESCAPTCHA_KEY" && test -n "$COOKIE_ENCRYPTION_KEY"
      - name: Sign in and post one random comment
        env:
          NS_USERNAME: ${{ secrets.NS_USERNAME }}
          NS_PASSWORD: ${{ secrets.NS_PASSWORD }}
          YESCAPTCHA_KEY: ${{ secrets.YESCAPTCHA_KEY }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_COMMENT_TEXTS: ${{ vars.NS_COMMENT_TEXTS }}
          NS_RANDOM: "false"
          NS_COMMENT: "true"
          PYTHONUNBUFFERED: "1"
        run: python nodeseek_daily.py
